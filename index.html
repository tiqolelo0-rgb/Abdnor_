
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172554">
<title>Nova | Friendship Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;font-family:Arial,sans-serif;color:white;background:linear-gradient(135deg,#101d46,#3730a3,#2563eb);display:flex;align-items:center;justify-content:center;padding:75px 0 65px}
.glow{position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none;animation:glowMove 8s infinite alternate ease-in-out}
.one{background:#60a5fa;top:-70px;right:-60px}
.two{background:#a78bfa;bottom:-80px;left:-60px;animation-delay:-4s}
@keyframes glowMove{to{transform:translate(35px,35px) scale(1.2)}}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.change-name{position:fixed;top:16px;right:14px;z-index:20;padding:10px 13px;border:1px solid #ffffff40;border-radius:13px;color:white;background:#ffffff18}
.name-panel{position:fixed;top:65px;right:14px;width:min(290px,calc(100vw - 28px));padding:17px;border:1px solid #ffffff35;border-radius:20px;background:#172554f5;z-index:30;display:none}
.name-panel.open{display:block;animation:enter .3s ease}
.name-panel h3{margin-bottom:12px}
input,textarea{width:100%;padding:12px;margin-top:7px;margin-bottom:12px;border:1px solid #ffffff40;border-radius:12px;color:white;background:#ffffff12;outline:none;font-size:15px;font-family:inherit}
input::placeholder,textarea::placeholder{color:#cbd5e1}
textarea{resize:vertical;min-height:75px}
.card{position:relative;z-index:2;width:min(440px,92vw);padding:27px 21px;text-align:center;border:1px solid #ffffff35;border-radius:27px;background:#ffffff13;backdrop-filter:blur(20px);box-shadow:0 20px 70px #0003;animation:enter .7s ease}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.bears{font-size:48px;margin-bottom:12px;animation:float 3s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-7px)}}
h1{font-size:clamp(23px,6vw,30px);line-height:1.5;margin-bottom:10px}
.desc{font-size:14px;color:#e0e7ff;line-height:1.9;margin-bottom:18px}
.btn{width:100%;padding:13px 15px;border:0;border-radius:13px;font-size:15px;font-weight:bold;margin-top:8px;transition:transform .2s}
.btn:active{transform:scale(.97)}
.primary{color:#172554;background:#bfdbfe}
.secondary{color:white;background:#ffffff20;border:1px solid #ffffff45}
.hidden{display:none!important}
.label{display:block;text-align:right;font-size:13px;color:#dbeafe;margin-top:5px}
.counter{font-size:12px;color:#bfdbfe;margin:10px 0}
.question-box{padding:17px 13px;border:1px solid #ffffff30;border-radius:16px;background:#ffffff10;font-size:19px;font-weight:bold;line-height:1.8;margin:18px 0}
.notice{margin-top:13px;padding:14px;border-radius:15px;background:#ffffff13;line-height:1.8;animation:enter .35s ease}
.brand{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);padding:8px 17px;border:1px solid #ffffff35;border-radius:30px;background:#ffffff12;color:white;font-size:12px;font-weight:bold;letter-spacing:2px;white-space:nowrap}
.brand span{color:#93c5fd}
.float-bear{position:fixed;bottom:-40px;z-index:5;pointer-events:none;animation:rise 5s linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(18deg);opacity:0}}
@media(max-width:360px){.card{padding:23px 15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="glow one"></div>
<div class="glow two"></div>

<button class="change-name" id="changeName">✏️ تغيير الاسم</button>
<div class="name-panel" id="namePanel">
<h3>✨ اسم الصديق</h3>
<input id="nameInput" maxlength="30" placeholder="اكتب الاسم...">
<button class="btn primary" id="saveName">حفظ الاسم ✓</button>
</div>

<main class="card">
<section id="home">
<div class="bears">🧸💙🧸</div>
<h1>تحدّي الصداقة</h1>
<p class="desc">شكون يعرف الإجابات؟ 🤔<br>حضّر أسئلتك وتحدّى أصحابك!</p>
<button class="btn primary" id="createBtn">➕ إنشاء أسئلة</button>
<button class="btn secondary" id="playBtn">🎮 الإجابة عن الأسئلة</button>
</section>

<section id="creator" class="hidden">
<div class="bears">📝✨</div>
<h1>حضّر التحدّي</h1>
<p class="desc">اكتب السؤال والإجابة الصحيحة، وصاحبك يحاول يجاوب!</p>
<div class="counter" id="questionCount">عدد الأسئلة: 0</div>
<label class="label" for="questionInput">السؤال</label>
<textarea id="questionInput" maxlength="250" placeholder="اكتب سؤالك..."></textarea>
<label class="label" for="answerInput">الإجابة الصحيحة</label>
<input id="answerInput" maxlength="100" placeholder="الإجابة الصحيحة">
<button class="btn secondary" id="addBtn">إضافة السؤال ＋</button>
<div id="creatorMessage"></div>
<button class="btn primary" id="shareBtn">🔗 إنشاء رابط المشاركة</button>
<button class="btn secondary" id="homeBtn">الرئيسية</button>
</section>

<section id="playing" class="hidden">
<div class="bears">🤔💭</div>
<h1>جاوب بصراحة!</h1>
<div class="counter" id="progress"></div>
<div class="question-box" id="questionText"></div>
<label class="label" for="userAnswer">إجابتك</label>
<input id="userAnswer" maxlength="150" placeholder="اكتب إجابتك هنا...">
<button class="btn primary" id="submitBtn">تأكيد الإجابة ✓</button>
<div id="feedback" class="notice hidden"></div>
<button class="btn secondary hidden" id="nextBtn">السؤال التالي ←</button>
<button class="btn secondary" id="exitBtn">إنهاء التحدّي</button>
</section>

<section id="finished" class="hidden">
<div class="bears">🏆🧸🎉</div>
<h1>انتهى التحدّي!</h1>
<div id="ratingStars" style="font-size:25px;margin:12px 0">⭐⭐⭐⭐⭐</div>
<p class="desc" id="finalText"></p>
<button class="btn primary" id="replayBtn">إعادة التحدّي ↻</button>
<button class="btn secondary" id="finishHome">الرئيسية</button>
</section>
</main>

<div class="brand">Nova <span>©</span></div>

<script>
const $=id=>document.getElementById(id);
const sections=["home","creator","playing","finished"];
let questions=[],index=0,score=0,answered=false,currentName="صديقي";

function show(id){
  sections.forEach(s=>$(s).classList.toggle("hidden",s!==id));
  $("namePanel").classList.remove("open");
  window.scrollTo({top:0,behavior:"smooth"});
}

$("changeName").onclick=()=>{
  $("nameInput").value=currentName;
  $("namePanel").classList.toggle("open");
};
$("saveName").onclick=()=>{
  currentName=$("nameInput").value.trim()||"صديقي";
  $("namePanel").classList.remove("open");
};
document.addEventListener("click",e=>{
  if(!$("namePanel").contains(e.target)&&e.target!==$("changeName"))
    $("namePanel").classList.remove("open");
});

function updateCount(){
  $("questionCount").textContent="عدد الأسئلة: "+questions.length;
}
function resetForm(){
  $("questionInput").value="";
  $("answerInput").value="";
  $("creatorMessage").textContent="";
}

$("createBtn").onclick=()=>{
  questions=[];
  updateCount();
  resetForm();
  show("creator");
};
$("homeBtn").onclick=()=>show("home");

$("addBtn").onclick=()=>{
  const q=$("questionInput").value.trim();
  const a=$("answerInput").value.trim();
  if(!q||!a){
    $("creatorMessage").textContent="⚠️ اكتب السؤال والإجابة أولاً!";
    return;
  }
  questions.push({q,a});
  updateCount();
  resetForm();
  $("creatorMessage").textContent="✅ تمت إضافة السؤال بنجاح!";
};

function encodeQuiz(data){
  const bytes=new TextEncoder().encode(JSON.stringify(data));
  let binary="";
  bytes.forEach(b=>binary+=String.fromCharCode(b));
  return btoa(binary);
}
function decodeQuiz(encoded){
  const binary=atob(encoded);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

$("shareBtn").onclick=async()=>{
  if(!questions.length){
    $("creatorMessage").textContent="⚠️ أضف سؤالاً واحداً على الأقل!";
    return;
  }
  const url=new URL(location.href);
  url.hash="quiz="+encodeQuiz(questions);
  try{
    await navigator.clipboard.writeText(url.href);
    $("creatorMessage").textContent="✅ تم نسخ رابط التحدّي! ابعثه لصاحبك.";
  }catch(e){
    $("creatorMessage").innerHTML="";
    const link=document.createElement("textarea");
    link.readOnly=true;
    link.value=url.href;
    $("creatorMessage").appendChild(link);
    const note=document.createElement("p");
    note.textContent="انسخ الرابط أعلاه وابعثه لصاحبك 🔗";
    $("creatorMessage").appendChild(note);
    link.select();
  }
};

function startQuiz(){
  if(!questions.length){
    $("creatorMessage").textContent="أضف أسئلة أولاً!";
    show("creator");
    return;
  }
  index=0;
  score=0;
  answered=false;
  show("playing");
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  $("progress").textContent="السؤال "+(index+1)+" من "+questions.length;
  $("questionText").textContent=questions[index].q;
  $("userAnswer").value="";
  $("userAnswer").disabled=false;
  $("feedback").classList.add("hidden");
  $("nextBtn").classList.add("hidden");
  $("submitBtn").classList.remove("hidden");
}

function normalize(s){
  return s.trim().toLocaleLowerCase()
    .replace(/[أإآ]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/\s+/g," ");
}

$("submitBtn").onclick=()=>{
  if(answered)return;
  const answer=$("userAnswer").value.trim();
  if(!answer){
    $("feedback").textContent="اكتب إجابتك أولاً 😄";
    $("feedback").classList.remove("hidden");
    return;
  }

  answered=true;
  const correct=normalize(answer)===normalize(questions[index].a);
  const feedback=$("feedback");
  feedback.classList.remove("hidden");
  $("userAnswer").disabled=true;
  $("submitBtn").classList.add("hidden");

  // خدعة: نقلب النتيجة المعروضة للّاعب
  if(correct){
    feedback.textContent="الإجابة غلط يا هطف😂";
  }else{
    score++;
    feedback.textContent="الإجابة صحيحة! 🎉";
  }

  $("nextBtn").classList.remove("hidden");
  createBears();
};

$("nextBtn").onclick=()=>{
  index++;
  if(index>=questions.length){
    // التقييم مبني على الإجابات التي اعتبرتها اللعبة صحيحة
    const rating=Math.round((score/questions.length)*10);
    $("ratingStars").textContent="⭐".repeat(Math.max(1,Math.round(rating/2)));
    $("finalText").textContent=
      "تقييمك: "+rating+"/10"+
      (rating<5
        ? " — لقد فشلت في الاختبار يا فاشل 😂💀"
        : " — مبروك! نجحت في التحدي يا أسطورة 🏆🔥");
    show("finished");
    createBears();
  }else{
    renderQuestion();
  }
};

$("exitBtn").onclick=()=>show("home");
$("replayBtn").onclick=startQuiz;
$("finishHome").onclick=()=>show("home");

$("playBtn").onclick=()=>{
  const data=location.hash.match(/^#quiz=(.+)$/);
  if(data){
    try{
      const parsed=decodeQuiz(data[1]);
      if(Array.isArray(parsed)&&parsed.length&&parsed.every(x=>x&&typeof x.q==="string"&&typeof x.a==="string")){
        questions=parsed;
        startQuiz();
        return;
      }
    }catch(e){}
  }
  questions=[];
  updateCount();
  resetForm();
  $("creatorMessage").textContent="افتح رابط التحدّي الذي أرسله لك صديقك، أو أنشئ أسئلة جديدة.";
  show("creator");
};

function createBears(){
  const emojis=["🧸","🤍","💙","🐻"];
  for(let i=0;i<9;i++){
    setTimeout(()=>{
      const b=document.createElement("div");
      b.className="float-bear";
      b.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      b.style.left=Math.random()*95+"vw";
      b.style.fontSize=(20+Math.random()*22)+"px";
      b.style.animationDuration=(4+Math.random()*3)+"s";
      document.body.appendChild(b);
      setTimeout(()=>b.remove(),7500);
    },i*150);
  }
}

const incoming=location.hash.match(/^#quiz=(.+)$/);
if(incoming){
  try{
    const parsed=decodeQuiz(incoming[1]);
    if(Array.isArray(parsed)&&parsed.length&&parsed.every(x=>x&&typeof x.q==="string"&&typeof x.a==="string")){
      questions=parsed;
      startQuiz();
    }
  }catch(e){}
}
</script>
</body>
</html>
