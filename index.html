
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554">
<title>Nova | Friendship</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;min-height:100dvh;
 font-family:Arial,sans-serif;color:#fff;
 background:linear-gradient(135deg,#101d46,#3730a3,#2563eb);
 display:flex;justify-content:center;align-items:center;
 padding:75px 0 65px;overflow-x:hidden
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.glow{position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(80px);opacity:.4;pointer-events:none;animation:glow 8s infinite alternate}
.one{background:#60a5fa;top:-70px;right:-60px}
.two{background:#a78bfa;bottom:-80px;left:-60px}
@keyframes glow{to{transform:translate(35px,35px) scale(1.2)}}
.card{
 position:relative;z-index:2;width:min(460px,92vw);
 padding:25px 19px;text-align:center;
 border:1px solid #ffffff35;border-radius:27px;
 background:#ffffff13;backdrop-filter:blur(20px);
 box-shadow:0 20px 70px #0003;animation:enter .5s ease
}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.bears{font-size:45px;margin-bottom:10px;animation:float 3s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-7px)}}
h1{font-size:clamp(23px,6vw,30px);line-height:1.5;margin:0 0 10px}
.desc{font-size:14px;color:#e0e7ff;line-height:1.9;margin-bottom:17px}
.btn{width:100%;padding:13px 14px;border:0;border-radius:13px;font-size:15px;font-weight:bold;margin-top:9px;transition:transform .2s}
.btn:active{transform:scale(.97)}
.primary{color:#172554;background:#bfdbfe}
.secondary{color:#fff;background:#ffffff20;border:1px solid #ffffff45}
.hidden{display:none!important}
label{display:block;text-align:right;font-size:13px;color:#dbeafe;margin-top:7px}
input,textarea,select{
 width:100%;padding:12px;margin:7px 0 12px;
 border:1px solid #ffffff40;border-radius:12px;
 color:#fff;background:#263665;font:inherit;outline:none
}
input::placeholder,textarea::placeholder{color:#cbd5e1}
textarea{resize:vertical;min-height:70px}
select option{background:#172554}
.counter{font-size:13px;color:#bfdbfe;margin:10px 0}
.question-box{padding:18px 13px;border:1px solid #ffffff30;border-radius:18px;background:#ffffff10;font-size:20px;font-weight:bold;line-height:1.8;margin:18px 0}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.option{
 min-width:0;min-height:130px;padding:11px 8px;
 border:2px solid #ffffff35;border-radius:20px;
 background:#ffffff12;color:#fff;display:flex;
 flex-direction:column;align-items:center;justify-content:center;gap:9px;
 transition:.2s;animation:enter .35s both
}
.option:active{transform:scale(.97)}
.option .art{font-size:39px}
.option .opttext{font-size:14px;line-height:1.6}
.option.selected{border-color:#60a5fa;background:#60a5fa30}
.option.correct{border-color:#34d399;background:#34d39925}
.option.wrong{border-color:#fb7185;background:#fb718525}
.option:disabled{cursor:default}
.notice{margin-top:13px;padding:13px;border-radius:15px;background:#ffffff13;line-height:1.8;border:1px solid #ffffff30}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:#dbeafe}
.number-track{display:flex;gap:5px;direction:ltr;margin:10px 0 15px}
.num{
 flex:1;min-width:0;height:31px;border-radius:9px;
 border:1px solid #ffffff40;background:#ffffff13;
 color:#fff;font-size:12px;font-weight:bold
}
.num.active{background:#1688ff;border-color:#1688ff;box-shadow:0 3px 0 #0756b2}
.num.done{background:#34d39930;border-color:#34d399;color:#bbf7d0}
.progress{height:7px;background:#ffffff20;border-radius:20px;overflow:hidden;margin:9px 0 17px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#c4b5fd);transition:width .35s}
.brand{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);padding:8px 17px;border:1px solid #ffffff35;border-radius:30px;background:#ffffff12;font-size:12px;font-weight:bold;letter-spacing:2px;white-space:nowrap}
.brand span{color:#93c5fd}
.rating-screen{animation:enter .7s ease}
.rating-icon{font-size:58px;margin:10px 0;animation:float 1.8s infinite;filter:drop-shadow(0 0 15px #facc15aa)}
.rating-circle{--rating:0%;width:155px;height:155px;margin:20px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#facc15 var(--rating),#ffffff18 var(--rating));position:relative;box-shadow:0 0 30px #60a5fa40;animation:circle 1s ease}
.rating-circle:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#172554;border:1px solid #ffffff25}
.rating-number{z-index:1;font-size:37px;font-weight:900;color:#fde68a}
.rating-number small{font-size:15px;color:#dbeafe}
@keyframes circle{from{transform:rotate(-90deg) scale(.7);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
.rating-stars{font-size:26px;letter-spacing:2px;margin:12px 0}
.rating-stars span{display:inline-block;animation:star .4s backwards}
.rating-stars span:nth-child(2){animation-delay:.1s}
.rating-stars span:nth-child(3){animation-delay:.2s}
.rating-stars span:nth-child(4){animation-delay:.3s}
.rating-stars span:nth-child(5){animation-delay:.4s}
@keyframes star{from{transform:scale(0)}to{transform:scale(1)}}
.rating-message{padding:16px 12px;margin:15px 0;border:1px solid #ffffff30;border-radius:18px;background:linear-gradient(135deg,#ffffff15,#60a5fa12);line-height:2}
.rating-message strong{color:#fde68a;font-size:18px}
.confetti{position:fixed;top:-25px;z-index:100;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(800deg);opacity:0}}
.small{font-size:12px;color:#cbd5e1;line-height:1.8;margin-top:12px}
@media(max-width:360px){.card{padding:20px 12px}.option{min-height:115px}.option .art{font-size:33px}.num{font-size:10px;height:28px}}
</style>
</head>
<body>
<div class="glow one"></div><div class="glow two"></div>

<main class="card">
<div class="brand">Nova <span>✦</span></div>

<!-- شاشة إدخال الأسماء -->
<section id="setup">
 <div class="bears">🧸💙🧸</div>
 <h1>اختبار الصداقة</h1>
 <p class="desc">أنشئ اختبارًا خاصًا بك وأرسله لصديقك! 💌</p>
 <label for="creatorName">اسم الشخص الأول (صاحب الاختبار)</label>
 <input id="creatorName" maxlength="30" placeholder="مثلاً: عبد النور">
 <label for="friendName">اسم الصديق الذي سيجيب</label>
 <input id="friendName" maxlength="30" placeholder="مثلاً: نوري">
 <button class="btn primary" id="setupNext">متابعة ←</button>
 <p class="small">أدخل الاسمين، ثم جهّز الأسئلة التي تريد أن يجيب عنها صديقك.</p>
</section>

<!-- إنشاء الأسئلة -->
<section id="editor" class="hidden">
 <div class="bears">📝✨</div>
 <h1>جهّز اختبارك</h1>
 <p class="desc" id="editorTitle"></p>
 <div class="counter" id="editorCount">عدد الأسئلة: 0</div>
 <label for="questionInput">السؤال</label>
 <textarea id="questionInput" maxlength="250" placeholder="اكتب سؤالك..."></textarea>
 <label>الاختيارات الأربعة</label>
 <input id="opt0" maxlength="100" placeholder="الاختيار الأول">
 <input id="opt1" maxlength="100" placeholder="الاختيار الثاني">
 <input id="opt2" maxlength="100" placeholder="الاختيار الثالث">
 <input id="opt3" maxlength="100" placeholder="الاختيار الرابع">
 <label for="correctSelect">الإجابة الصحيحة</label>
 <select id="correctSelect">
  <option value="0">الاختيار الأول</option>
  <option value="1">الاختيار الثاني</option>
  <option value="2">الاختيار الثالث</option>
  <option value="3">الاختيار الرابع</option>
 </select>
 <button class="btn secondary" id="addQuestion">➕ إضافة السؤال</button>
 <div id="editorMessage" class="notice hidden"></div>
 <button class="btn primary" id="makeLink">🔗 إنشاء رابط لصديقي</button>
 <button class="btn secondary" id="startOwn">▶️ تجربة الاختبار</button>
 <button class="btn secondary" id="backSetup">← تغيير الأسماء</button>
</section>

<!-- شاشة اللعب -->
<section id="playing" class="hidden">
 <div class="bears">🤔💭</div>
 <h1 id="gameTitle">اختبار الصداقة</h1>
 <div class="progress-label">
  <span id="progressText">السؤال 1 من 10</span>
  <span id="progressPercent">0%</span>
 </div>
 <div class="number-track" id="numberTrack"></div>
 <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
 <div class="question-box" id="questionText"></div>
 <div class="options" id="options"></div>
 <div id="feedback" class="notice hidden"></div>
 <button class="btn primary hidden" id="nextBtn">السؤال التالي ←</button>
 <button class="btn secondary" id="quitBtn">🏠 الرئيسية</button>
</section>

<!-- التقييم -->
<section id="finished" class="hidden rating-screen">
 <div class="rating-icon" id="ratingIcon">🏆</div>
 <h1 id="ratingTitle">انتهى الاختبار!</h1>
 <p class="desc" id="resultSubtitle">نتيجة اختبار الصداقة من Nova ✨</p>
 <div class="rating-circle" id="ratingCircle">
  <div class="rating-number"><span id="ratingValue">0</span><small>/10</small></div>
 </div>
 <div class="rating-stars" id="ratingStars">☆☆☆☆☆</div>
 <div class="rating-message" id="finalText"></div>
 <p class="desc" id="scoreDetails"></p>
 <button class="btn primary" id="replayBtn">🔄 إعادة الاختبار</button>
 <button class="btn secondary" id="homeBtn">🏠 الرئيسية</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const screens=["setup","editor","playing","finished"];

let creatorName="";
let friendName="";
let questions=[];
let index=0;
let score=0;
let answered=false;
let sharedMode=false;

const defaults=[
 {q:"على ماذا ينفق معظم ماله؟",opts:["وجبات خفيفة / طعام 🍔","لا شيء — يدّخره 💰","الألعاب 🎮","الملابس 👕"],correct:0},
 {q:"ما أكثر شيء يحبّه في وقت الفراغ؟",opts:["الألعاب 🎮","النوم 😴","الخروج 🌳","الأنمي 🍥"],correct:3},
 {q:"ما الذي يفرحه أكثر؟",opts:["هدية 🎁","رسالة من صديق 💌","وجبة لذيذة 🍕","الفوز 🏆"],correct:1},
 {q:"إذا حصل على المال، ماذا يفعل؟",opts:["يشتري شيئًا 🛍️","يدّخره 🐷","يدعو أصدقاءه 🍔","يشحن لعبة 💎"],correct:3},
 {q:"ما نوع الفيديوهات التي يحبّها؟",opts:["الأنمي ⚔️","الألعاب 🎮","الضحك 😂","كل الأنواع ✨"],correct:0},
 {q:"كيف يقضي يوم العطلة؟",opts:["ينام 😴","يلعب 🎮","يتنزه 🌳","يشاهد فيلمًا 🎬"],correct:1},
 {q:"أي هدية قد تعجبه أكثر؟",opts:["سماعات 🎧","لعبة 🎮","حلوى 🍫","هدية من صديق 💝"],correct:3},
 {q:"ماذا يفعل عندما يشعر بالملل؟",opts:["يفتح الهاتف 📱","يلعب 🎮","يتحدث مع أصدقائه 💬","ينام 😴"],correct:0},
 {q:"أين يفضّل الخروج؟",opts:["مطعم 🍔","حديقة 🌳","مركز ألعاب 🕹️","مع الأصدقاء 💙"],correct:3},
 {q:"ما الأهم في الصداقة؟",opts:["الثقة 🤝","الضحك 😂","المساعدة 💙","كل ما سبق 💖"],correct:3}
].map(q=>({q:q.q,opts:q.opts.map(text=>({text})),correct:q.correct}));

function show(id){
 screens.forEach(s=>$(s).classList.toggle("hidden",s!==id));
 window.scrollTo({top:0,behavior:"smooth"});
}
function safeText(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalize(s){
 return s.trim().toLowerCase().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/\s+/g," ");
}
function updateEditorCount(){
 $("editorCount").textContent="عدد الأسئلة: "+questions.length;
}
function fillEditor(){
 const q=questions[questions.length-1];
 if(!q)return;
 $("questionInput").value=q.q;
 q.opts.forEach((o,i)=>$("opt"+i).value=o.text);
 $("correctSelect").value=String(q.correct);
}
function readEditor(){
 const q=$("questionInput").value.trim();
 const opts=[0,1,2,3].map(i=>$("opt"+i).value.trim());
 if(!q||opts.some(o=>!o)){
  editorMessage("⚠️ اكتب السؤال وجميع الاختيارات الأربعة.");
  return null;
 }
 return {q,opts:opts.map(text=>({text})),correct:Number($("correctSelect").value)};
}
function editorMessage(text){
 $("editorMessage").textContent=text;
 $("editorMessage").classList.remove("hidden");
}
$("setupNext").onclick=()=>{
 creatorName=$("creatorName").value.trim();
 friendName=$("friendName").value.trim();
 if(!creatorName||!friendName){
  alert("اكتب اسمك واسم صديقك أولاً 😊");return;
 }
 questions=structuredClone(defaults);
 updateEditorCount();
 $("editorTitle").textContent="اختبار صداقتك مع "+friendName+" 💙";
 fillEditor();
 show("editor");
};
$("backSetup").onclick=()=>show("setup");

$("addQuestion").onclick=()=>{
 const q=readEditor();
 if(!q)return;
 if(questions.length>=10){
  editorMessage("وصلت إلى 10 أسئلة. يمكنك تعديل أي سؤال من الأسئلة الحالية.");
  return;
 }
 questions[questions.length-1]=q;
 if(questions.length===10){
  editorMessage("تم حفظ السؤال. وصلت إلى 10 أسئلة.");
  updateEditorCount();return;
 }
 questions.push({q:"سؤال جديد",opts:[{text:"الاختيار الأول"},{text:"الاختيار الثاني"},{text:"الاختيار الثالث"},{text:"الاختيار الرابع"}],correct:0});
 updateEditorCount();
 fillEditor();
 editorMessage("✅ تم حفظ السؤال. أكمل السؤال التالي.");
};

function encodeData(obj){
 const bytes=new TextEncoder().encode(JSON.stringify(obj));
 let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));
 return btoa(bin);
}
function decodeData(s){
 const bin=atob(s);
 return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
}
function validQuiz(d){
 return d&&typeof d.creator==="string"&&typeof d.friend==="string"&&Array.isArray(d.questions)&&d.questions.length>0&&d.questions.length<=10&&d.questions.every(q=>q&&typeof q.q==="string"&&Array.isArray(q.opts)&&q.opts.length===4&&q.opts.every(o=>o&&typeof o.text==="string")&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<4);
}
async function shareLink(){
 const q=readEditor();
 if(!q)return;
 questions[questions.length-1]=q;
 if(!questions.length){editorMessage("أضف سؤالاً أولاً.");return}
 const payload={creator:creatorName,friend:friendName,questions};
 const url=new URL(location.href);
 url.hash="quiz="+encodeData(payload);
 try{
  await navigator.clipboard.writeText(url.href);
  editorMessage("✅ تم نسخ الرابط! أرسله إلى "+friendName+".");
 }catch(e){
  const field=document.createElement("textarea");
  field.value=url.href;
  $("editorMessage").replaceChildren(field);
  editorMessage("انسخ الرابط التالي وأرسله لصديقك:");
  $("editorMessage").appendChild(field);
  field.select();
 }
}
$("makeLink").onclick=shareLink;

function startQuiz(){
 if(!questions.length){show("editor");return}
 index=0;score=0;answered=false;
 $("gameTitle").textContent="اختبار صداقتك مع "+friendName;
 show("playing");
 renderQuestion();
}
$("startOwn").onclick=()=>{
 const q=readEditor();if(!q)return;
 questions[questions.length-1]=q;
 sharedMode=false;
 startQuiz();
};

function renderQuestion(){
 answered=false;
 const q=questions[index];
 $("progressText").textContent="السؤال "+(index+1)+" من "+questions.length;
 const percent=Math.round(index/questions.length*100);
 $("progressPercent").textContent=percent+"%";
 $("progressFill").style.width=percent+"%";
 $("questionText").textContent=q.q;
 $("feedback").classList.add("hidden");
 $("nextBtn").classList.add("hidden");
 $("options").innerHTML="";
 const track=$("numberTrack");track.innerHTML="";
 for(let i=0;i<10;i++){
  const b=document.createElement("div");
  b.className="num"+(i===index?" active":i<index?" done":"");
  b.textContent=i+1;
  b.style.display=i<questions.length?"block":"none";
  track.appendChild(b);
 }
 q.opts.forEach((opt,i)=>{
  const b=document.createElement("button");
  b.className="option";
  const art=document.createElement("div");art.className="art";
  art.textContent=["🧸","💙","✨","🎮"][i];
  const txt=document.createElement("div");txt.className="opttext";
  txt.textContent=opt.text;
  b.append(art,txt);
  b.onclick=()=>choose(i);
  $("options").appendChild(b);
 });
}
function choose(choice){
 if(answered)return;
 answered=true;
 const q=questions[index];
 const correct=choice===q.correct;
 if(correct)score++;
 [...$("options").children].forEach((b,i)=>{
  b.disabled=true;
  if(i===q.correct)b.classList.add("correct");
  if(i===choice&&i!==q.correct)b.classList.add("wrong");
 });
 $("feedback").classList.remove("hidden");
 $("feedback").textContent=correct?"🎉 إجابة صحيحة! برافو!":"💙 الإجابة الصحيحة: "+q.opts[q.correct].text;
 $("progressFill").style.width=((index+1)/questions.length*100)+"%";
 $("progressPercent").textContent=Math.round((index+1)/questions.length*100)+"%";
 $("progressText").textContent="تمت الإجابة عن "+(index+1)+" من "+questions.length;
 const nums=[...$("numberTrack").children];
 if(nums[index])nums[index].classList.add("done");
 $("nextBtn").classList.remove("hidden");
 $("nextBtn").textContent=index===questions.length-1?"🏆 عرض التقييم":"السؤال التالي ←";
}
$("nextBtn").onclick=()=>{
 if(!answered)return;
 if(index<questions.length-1){index++;renderQuestion()}
 else showResult();
};
function showResult(){
 const rating=Math.round(score/questions.length*10);
 $("ratingValue").textContent=rating;
 $("ratingCircle").style.setProperty("--rating",rating*10+"%");
 const stars=Math.round(rating/2);
 $("ratingStars").innerHTML=Array.from({length:5},(_,i)=>`<span>${i<stars?"⭐":"☆"}</span>`).join("");
 $("scoreDetails").textContent="الإجابات الصحيحة: "+score+" من "+questions.length;
 $("resultSubtitle").textContent="نتيجة اختبار "+creatorName+" و"+friendName+" ✨";
 if(rating<5){
  $("ratingIcon").textContent="💙";
  $("ratingTitle").textContent="بداية جميلة!";
  $("finalText").innerHTML="<strong>ما تستسلمش! 🧸</strong><br>يمكنك إعادة الاختبار وتحسين نتيجتك.";
 }else if(rating<8){
  $("ratingIcon").textContent="🔥";
  $("ratingTitle").textContent="نتيجة مليحة!";
  $("finalText").innerHTML="<strong>راك تعرف صديقك مليح! 😎</strong><br>باقي شوية وتولي أسطورة 💙";
 }else{
  $("ratingIcon").textContent="👑";
  $("ratingTitle").textContent="أسطورة Nova!";
  $("finalText").innerHTML="<strong>نتيجة خرافية! 🏆</strong><br>معرفة قوية بالصداقة! 👑✨";
 }
 show("finished");
 if(rating>=5)confetti();
}
function confetti(){
 const colors=["#facc15","#60a5fa","#c084fc","#fb7185","#34d399"];
 for(let i=0;i<55;i++){
  const p=document.createElement("div");p.className="confetti";
  p.textContent=Math.random()>.5?"✦":"●";
  p.style.left=Math.random()*100+"vw";
  p.style.color=colors[Math.floor(Math.random()*colors.length)];
  p.style.fontSize=(10+Math.random()*13)+"px";
  p.style.animationDuration=(2+Math.random()*3)+"s";
  p.style.animationDelay=Math.random()+"s";
  document.body.appendChild(p);setTimeout(()=>p.remove(),6500);
 }
}
$("quitBtn").onclick=()=>show("setup");
$("homeBtn").onclick=()=>show("setup");
$("replayBtn").onclick=startQuiz;

// إذا فتح الصديق رابطًا مرسلًا من الشخص الأول
const incoming=location.hash.match(/^#quiz=(.+)$/);
if(incoming){
 try{
  const data=decodeData(incoming[1]);
  if(validQuiz(data)){
   creatorName=data.creator;
   friendName=data.friend;
   questions=data.questions;
   sharedMode=true;
   $("gameTitle").textContent="اختبار صداقتك مع "+friendName;
   startQuiz();
  }
 }catch(e){}
}
</script>
</body>
</html>
